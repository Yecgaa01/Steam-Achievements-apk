name: steam_achievements_apk
description: Steam achievements viewer.
publish_to: 'none'
version: 2.0.0+71

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  flutter_inappwebview: ^6.1.5
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pp_guide/pp.json
    - assets/pp_guide/pst.json
